
name: User Build Workflow

on:
  push:
    branches: [ "main" ]
    # paths:
    #   - user/**
  pull_request:
    branches: [ "main" ]
    # paths:
    #   - user/**
  

jobs:
  build:
    strategy:
      matrix:
        os : ['ubuntu-latest', 'windows-latest', 'macos-latest']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.5'
        cache: true
        cache-dependency-path: user/go.sum

    - name: Build
      working-directory: user
      run: go build -v ./...

    # - name: Test
    #   run: go test -v ./...