
name: Go

on:
  push:
    branches: [ "main" ]
    paths:
      - user/**
  pull_request:
    branches: [ "main" ]
    paths:
      - user/**
  

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache: true
        cache-dependency-path: user/go.sum

    - name: Build
      working-directory: user
      run: go build -v ./...

    # - name: Test
    #   run: go test -v ./...
