#user db statefulset
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "url-short-cluster.fullname" . }}-user-db
  labels:
    {{- include "url-short-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-db-statefulset
spec:
  serviceName: {{ include "url-short-cluster.fullname" . }}-user-db-service
  selector:
    matchLabels:
      {{- include "url-short-cluster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: user-db-pod
  template:
    metadata:
      labels:
        {{- include "url-short-cluster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: user-db-pod
    spec:
      containers:
        - name: user-db-pod
          image: "{{ .Values.image.user.db.repository }}:{{ .Values.image.user.db.tag }}"
        {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
        {{- end }}
          ports:
            - containerPort: {{ .Values.port.userDb | default 5432 }}
          envFrom:
            - configMapRef:
                name: {{ include "url-short-cluster.fullname" . }}-user-db-cm
          volumeMounts:
            - name: user-db-pvc
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: user-db-pvc
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "local-storage"
        resources:
          requests:
            storage: 1Gi


