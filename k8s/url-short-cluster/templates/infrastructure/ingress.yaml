---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ include "url-short-cluster.fullname" . }}-gatewayclass
  annotations:
    konghq.com/gatewayclass-unmanaged: "true"
spec:
  controllerName: konghq.com/kic-gateway-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "url-short-cluster.fullname" . }}-gateway
spec:
  gatewayClassName: {{ include "url-short-cluster.fullname" . }}-gatewayclass
  listeners:
    - name: proxy
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "url-short-cluster.fullname" . }}-route
  annotations:
    konghq.com/strip-path: "true"
spec:
  parentRefs:
    - name: {{ include "url-short-cluster.fullname" . }}-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/user"
      backendRefs:
        - name: {{ include "url-short-cluster.fullname" . }}-user-service
          kind: Service
          port: {{ .Values.port.userPod }}
